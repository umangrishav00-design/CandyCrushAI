
name: Build Candy Crush AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project ZIP
        run: test -f CandyCrushAI_GitHubBuild.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -q CandyCrushAI_GitHubBuild.zip -d project

      - name: Set Java and Kotlin targets to 17
        run: |
          find project -name build.gradle.kts -print
          FILE=$(find project -path '*/app/build.gradle.kts' -print -quit)
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          s = s.replace('VERSION_1_8', 'VERSION_17')
          s = s.replace('VERSION_1_8', 'VERSION_17')
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandyCrushAI-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
